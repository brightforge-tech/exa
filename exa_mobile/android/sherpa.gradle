// sherpa-onnx: on-device keyword spotting for "Hey Exa".
//
// Fetched at build time rather than committed: ~40 MB of native library and
// model the repository does not need to carry. Every file is pinned to a
// release and checked against its SHA-256, so a build never runs anything
// other than these exact bytes. Applied by the app (which ships the library
// and the model) and by packages/exa_voice (which compiles against it).
//
// Both are Apache-2.0: https://github.com/k2-fsa/sherpa-onnx

import java.security.MessageDigest

def sherpaVersion = '2.0.3'
def sherpaDir = rootProject.file('.sherpa')
def sherpaAar = new File(sherpaDir, "sherpa-onnx-static-link-onnxruntime-${sherpaVersion}.aar")
def sherpaClasses = new File(sherpaDir, "sherpa-onnx-classes-${sherpaVersion}.jar")
def kwsArchive = new File(sherpaDir, 'sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2')
def kwsAssets = new File(sherpaDir, 'assets')

def sha256 = { File f ->
    def digest = MessageDigest.getInstance('SHA-256')
    f.withInputStream { stream ->
        byte[] buffer = new byte[1 << 16]
        int n
        while ((n = stream.read(buffer)) > 0) digest.update(buffer, 0, n)
    }
    digest.digest().encodeHex().toString()
}

def fetch = { String url, File dest, String expected ->
    if (dest.exists() && sha256(dest) == expected) return
    dest.parentFile.mkdirs()
    def partial = new File(dest.path + '.part')
    logger.lifecycle("Downloading ${dest.name}")
    new URL(url).withInputStream { input -> partial.withOutputStream { it << input } }
    def actual = sha256(partial)
    if (actual != expected) {
        partial.delete()
        throw new GradleException("${dest.name}: SHA-256 ${actual} does not match the pinned ${expected}")
    }
    dest.delete()
    partial.renameTo(dest)
}

if (!rootProject.ext.has('sherpaPrepared')) {
    rootProject.ext.sherpaPrepared = true
    def base = 'https://github.com/k2-fsa/sherpa-onnx/releases/download'
    fetch("${base}/v${sherpaVersion}/${sherpaAar.name}", sherpaAar,
        '7744a3a8f08f017d59c2d8ed8d9b700345561f5abe9f4e06dc6eaef3a0b977b4')
    fetch("${base}/kws-models/${kwsArchive.name}", kwsArchive,
        'f170013b4716e41b62b9bfd809687c207cef798ef9bc6534d524e17af9b6561a')

    if (!sherpaClasses.exists()) {
        rootProject.copy {
            from(rootProject.zipTree(sherpaAar)) { include 'classes.jar' }
            into sherpaDir
            rename { sherpaClasses.name }
        }
    }
    // The int8 transducer and its tokens: ~5 MB, everything the spotter
    // reads. The phrase is passed at runtime; keywords.txt is the fallback
    // the native constructor insists on.
    def wanted = [
        'encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx',
        'decoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx',
        'joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx',
        'tokens.txt',
    ]
    def kwsDir = new File(kwsAssets, 'kws')
    if (!wanted.every { new File(kwsDir, it).exists() }) {
        rootProject.copy {
            from(rootProject.tarTree(rootProject.resources.bzip2(kwsArchive))) {
                include wanted.collect { "**/${it}" }
                eachFile { it.path = it.name }
            }
            into kwsDir
            includeEmptyDirs = false
        }
    }
    new File(kwsDir, 'keywords.txt').text = '▁HE Y ▁EX A @WAKE_HEY_EXA\n'
}

ext.sherpaAar = sherpaAar
ext.sherpaClasses = sherpaClasses
ext.sherpaAssets = kwsAssets
