name: exa_phone
description: >-
  Exa's phone access plugin: SMS, calls, WhatsApp hand-off and contact lookup.
  A real (local) Flutter plugin rather than a MethodChannel in MainActivity so
  that it is registered in EVERY FlutterEngine - including the WorkManager and
  alarm isolates that run scheduled jobs, which never see the activity's own
  channels.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.brightforge.exa.phone
        pluginClass: ExaPhonePlugin
